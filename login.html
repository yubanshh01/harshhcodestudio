<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Login | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <style>
        body {
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        }

        #cyber-intro {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .scanner-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: -10px;
            width: 120px;
            height: 3px;
            background: #38bdf8;
            box-shadow: 0 0 15px 5px rgba(56, 189, 248, 0.5);
            animation: scanMove 1.2s ease-in-out infinite alternate;
            z-index: 2;
        }

        .scanner-container.unlocked {
            animation: pulseGlow 1s ease forwards;
        }

        .intro-text {
            color: #38bdf8;
            font-family: var(--font-code);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px #38bdf8); transform: scale(1); }
            50% { filter: drop-shadow(0 0 40px #38bdf8); transform: scale(1.1); }
            100% { filter: drop-shadow(0 0 15px #10b981); transform: scale(1); }
        }

        .login-main-wrapper {
            max-width: 500px;
            margin: 3rem auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            padding: 3rem 2.5rem;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .login-main-wrapper.show-dashboard {
            opacity: 1;
            transform: translateY(0);
        }

        .greeting-container {
            text-align: center;
            min-height: 55px;
            margin-bottom: 1.5rem;
        }

        .typing-text {
            color: #0f172a;
            font-family: var(--font-code);
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            background-color: #0ea5e9;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .form-group label {
            font-weight: 700;
            color: #334155;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            background: #f8fafc;
            border: 2px solid transparent;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            background: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56,189,248,0.15);
            outline: none;
        }

        .btn-auth {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(2,132,199,0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(2,132,199,0.4);
        }

        .auth-error-banner {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .login-main-wrapper { margin: 2rem 1rem; padding: 2rem 1.5rem; }
            .typing-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div id="cyber-intro">
        <div class="scanner-container" id="securityScanner">
            <div id="lockIcon">🛡️</div>
            <div class="scan-line" id="laserBeam"></div>
        </div>
        <p class="intro-text" id="introStatus">INITIATING SECURE PROTOCOL...</p>
    </div>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-dropdown" id="pagesDropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown(event)">Pages ▾</button>
                        <div class="dropdown-content" id="dropdownMenu">
                            <a href="services.html">Services</a>
                            <a href="feed.html">Posts</a>
                            <a href="reviews.html">Reviews</a>
                            <a href="login.html" class="active">👤 Admin Portal</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="login-main-wrapper" id="mainLoginBox">
            <div class="greeting-container">
                <span class="typing-text" id="typewriterText"></span><span class="cursor" id="cursorElement">&nbsp;</span>
            </div>

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2 style="color: var(--text-dark); font-size: 1.5rem; font-weight: 800;">Admin Authorization</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; font-weight: 600;">Zero-Trust Encrypted Gateway</p>
            </div>

            <div id="loginErrorMessage" class="auth-error-banner"></div>

            <form id="loginStep1Form">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="adminMobile">Registered Mobile Number</label>
                    <input type="tel" id="adminMobile" placeholder="Enter secure mobile ID" required autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="adminPassword">Master Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter vault password" required autocomplete="current-password">
                </div>
                <button type="submit" id="step1Btn" class="btn-auth">Authenticate</button>
            </form>
        </div>
    </main>

    <script>
        const AUTH_CONFIG = {
            enabled: false,
            sessionTokenName: 'harsh_admin_token',
            sessionValue: 'replace-with-server-generated-token',
            notice: 'Admin authentication is disabled in this public repository until a secure backend is configured.'
        };

        function showLoginError(msg) {
            const errBanner = document.getElementById('loginErrorMessage');
            errBanner.innerText = msg;
            errBanner.style.display = 'block';
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('pagesDropdown').classList.toggle('active');
        }

        window.addEventListener('click', () => {
            document.getElementById('pagesDropdown').classList.remove('active');
        });

        window.addEventListener('DOMContentLoaded', () => {
            const SESSION_TOKEN = AUTH_CONFIG.sessionValue;
            if (localStorage.getItem(AUTH_CONFIG.sessionTokenName) === SESSION_TOKEN) {
                window.location.href = 'admin.html';
                return;
            }

            const introScreen = document.getElementById('cyber-intro');
            const scanner = document.getElementById('securityScanner');
            const lockIcon = document.getElementById('lockIcon');
            const introStatus = document.getElementById('introStatus');
            const mainBox = document.getElementById('mainLoginBox');

            setTimeout(() => {
                lockIcon.innerText = '🔓';
                scanner.classList.add('unlocked');
                introStatus.innerText = 'CONNECTION ESTABLISHED';
                introStatus.style.color = '#10b981';
            }, 1500);

            setTimeout(() => {
                introScreen.style.opacity = '0';
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainBox.classList.add('show-dashboard');
                    setTimeout(startTypingGreeting, 600);
                }, 600);
            }, 2500);
        });

        function startTypingGreeting() {
            const text1 = 'WELCOME ADMIN,';
            const text2 = 'SECURE BACKEND AUTH MUST BE ENABLED.';
            const target = document.getElementById('typewriterText');
            let i = 0;
            let currentLine = 1;

            function typeWriter() {
                if (currentLine === 1) {
                    if (i < text1.length) {
                        target.innerHTML += text1.charAt(i);
                        i++;
                        setTimeout(typeWriter, 50);
                    } else {
                        target.innerHTML += '<br>';
                        currentLine = 2;
                        i = 0;
                        setTimeout(typeWriter, 300);
                    }
                } else if (currentLine === 2) {
                    if (i < text2.length) {
                        target.innerHTML += text2.charAt(i);
                        i++;
                        setTimeout(typeWriter, 40);
                    }
                }
            }
            typeWriter();
        }

        document.getElementById('loginStep1Form').addEventListener('submit', function (e) {
            e.preventDefault();
            const mobile = document.getElementById('adminMobile').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const btn = document.getElementById('step1Btn');

            if (!mobile || !password) {
                showLoginError('Please enter mobile and password.');
                return;
            }

            if (!AUTH_CONFIG.enabled) {
                btn.disabled = true;
                showLoginError(AUTH_CONFIG.notice + ' Configure a real backend auth flow before enabling admin access.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Authenticating...';

            fetch('/api/admin/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mobile, password })
            })
            .then(async response => {
                if (!response.ok) {
                    const data = await response.json().catch(() => ({ error: 'Authentication failed.' }));
                    throw new Error(data.error || 'Authentication failed.');
                }
                return response.json();
            })
            .then(result => {
                if (result && result.token) {
                    localStorage.setItem(AUTH_CONFIG.sessionTokenName, result.token);
                    window.location.href = 'admin.html';
                } else {
                    throw new Error('Invalid auth response.');
                }
            })
            .catch(err => {
                showLoginError(err.message || 'Authentication failed.');
                btn.disabled = false;
                btn.innerText = 'Authenticate';
            });
        });
    </script>
</body>
</html>
