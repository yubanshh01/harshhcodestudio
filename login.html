<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <style>
        /* =========================================
           1. CINEMATIC 3D INTRO ANIMATION (CSS ENGINE)
           ========================================= */
        #cinematic-intro {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #090e17;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-in-out;
            overflow: hidden;
        }

        /* Character carrying suitcase */
        .intro-character-box {
            position: relative;
            transform: translateX(-100vw);
            animation: walkIn 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 3D Character Image Placeholder */
        .intro-character-box img {
            width: 250px;
            filter: drop-shadow(0 20px 20px rgba(0,0,0,0.5));
            z-index: 2;
        }

        /* The Magic Suitcase Glow */
        .suitcase-glow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 10px; height: 10px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 100px 100px #38bdf8, 0 0 300px 300px #ffffff;
            opacity: 0;
            z-index: 3;
        }

        .suitcase-glow.explode {
            animation: openSuitcaseGlow 1.5s ease-in forwards;
        }

        @keyframes walkIn {
            0% { transform: translateX(-100vw) rotate(-10deg); }
            80% { transform: translateX(20px) rotate(5deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        @keyframes openSuitcaseGlow {
            0% { transform: translateX(-50%) scale(0); opacity: 1; }
            50% { transform: translateX(-50%) scale(50); opacity: 1; }
            100% { transform: translateX(-50%) scale(150); opacity: 1; }
        }

        /* =========================================
           2. MAIN DASHBOARD LOGIN (SPLIT SCREEN)
           ========================================= */
        .login-main-wrapper { 
            max-width: 900px; 
            margin: 4rem auto; 
            display: flex;
            border-radius: 16px;
            background: var(--white);
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(40px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .login-main-wrapper.show-dashboard {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Left Side: 3D Character Standing */
        .character-side {
            width: 45%;
            background: linear-gradient(145deg, #0b1329 0%, #1a2a4f 100%);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Typewriter Text Box */
        .greeting-box {
            min-height: 80px;
            margin-bottom: 20px;
            text-align: center;
            z-index: 2;
        }

        .typing-text {
            color: #38bdf8;
            font-family: var(--font-code);
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(56,189,248,0.5);
        }

        /* Blinking Cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #38bdf8;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Standing 3D Character */
        .standing-character {
            width: 260px;
            filter: drop-shadow(10px 20px 15px rgba(0,0,0,0.4));
            animation: subtleBreathe 4s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes subtleBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        /* Right Side: Login Form */
        .form-side {
            width: 55%;
            padding: 3.5rem 3rem;
            position: relative;
            background: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .step-2-otp { display: none; }
        .hint-text { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; text-align: center; }
        
        .auth-error-banner {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 850px) {
            .login-main-wrapper { flex-direction: column; max-width: 440px; }
            .character-side, .form-side { width: 100%; }
            .standing-character { width: 180px; }
            .form-side { padding: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- =========================================
         SCENE 1: THE 3D SUITCASE INTRO OVERLAY
         ========================================= -->
    <div id="cinematic-intro">
        <div class="intro-character-box">
            <!-- 3D Character carrying suitcase -->
            <img src="https://cdn3d.iconscout.com/3d/premium/thumb/businessman-holding-briefcase-5065977-4225251.png" alt="3D Character Arriving">
            <div class="suitcase-glow" id="flashGlow"></div>
        </div>
        <p id="loadingText" style="position:absolute; bottom:40px; color:#38bdf8; font-family:var(--font-code); letter-spacing:3px; font-size:0.8rem; animation: blink 1s infinite;">SYSTEM SECURE UPLINK IN PROGRESS...</p>
    </div>

    <!-- Background Header -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-dropdown" id="pagesDropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown(event)">Pages ▾</button>
                        <div class="dropdown-content" id="dropdownMenu">
                            <a href="services.html">Services</a>
                            <a href="feed.html">Posts</a>
                            <a href="reviews.html">Reviews</a>
                            <a href="login.html" class="active">👤 Admin Portal</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- =========================================
             SCENE 2: THE REVEAL & LOGIN BOX
             ========================================= -->
        <div class="login-main-wrapper" id="mainLoginBox">
            
            <!-- Left Side: 3D Character Standing Support -->
            <div class="character-side">
                <div class="greeting-box">
                    <span class="typing-text" id="typewriterText"></span><span class="cursor" id="cursorElement">&nbsp;</span>
                </div>
                <!-- Standing Character (Same character, different pose) -->
                <img src="https://cdn3d.iconscout.com/3d/premium/thumb/businessman-using-laptop-5065974-4225248.png" alt="3D Admin Standing" class="standing-character">
            </div>

            <!-- Right Side: Professional Secure Form -->
            <div class="form-side">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <span style="font-size: 2.2rem;">🛡️</span>
                    <h2 style="color: var(--text-dark); margin-top: 5px; font-size: 1.6rem; font-weight: 800;">Admin Authorization</h2>
                    <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Zero-Trust Encrypted Gateway</p>
                </div>

                <div id="loginErrorMessage" class="auth-error-banner"></div>

                <!-- Step 1: Mobile & Password Form -->
                <form id="loginStep1Form">
                    <div class="form-group">
                        <label for="adminMobile" style="font-weight: 700; color: #334155;">Registered Mobile Number</label>
                        <input type="tel" id="adminMobile" placeholder="Enter secure mobile ID" required autocomplete="username" style="padding: 12px; border-radius: 8px;">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword" style="font-weight: 700; color: #334155;">Master Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter vault password" required autocomplete="current-password" style="padding: 12px; border-radius: 8px;">
                    </div>
                    <button type="submit" id="step1Btn" class="btn" style="width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px;">Authenticate & Get OTP ✉️</button>
                </form>

                <!-- Step 2: Formspree Email OTP Form -->
                <form id="loginStep2Form" class="step-2-otp">
                    <div class="form-group">
                        <label for="emailOtp" style="font-weight: 700; color: #334155; text-align: center; display: block;">Enter 6-Digit Email OTP</label>
                        <input type="text" id="emailOtp" placeholder="••••••" maxlength="6" required style="font-family: var(--font-code); font-size: 1.4rem; letter-spacing: 8px; text-align: center; padding: 12px; border-radius: 8px;">
                        <p class="hint-text">Secure OTP sent to your registered email.</p>
                    </div>
                    <button type="submit" id="step2Btn" class="btn" style="width: 100%; margin-top: 10px; background:#16a34a; padding: 12px; border-radius: 8px;">Verify & Open Dashboard 🚀</button>
                    <button type="button" onclick="cancelOtp()" style="width: 100%; background: none; border: none; margin-top: 15px; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600;">← Back to Credentials</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Core Logic Engine -->
    <script>
        // ==========================================
        // 1. CINEMATIC TIMELINE CONTROLLER
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
            if (localStorage.getItem("harsh_admin_token") === SESSION_TOKEN) {
                window.location.href = "admin.html";
                return;
            }

            const introScreen = document.getElementById('cinematic-intro');
            const flashGlow = document.getElementById('flashGlow');
            const mainBox = document.getElementById('mainLoginBox');
            const loadingText = document.getElementById('loadingText');

            // Timeline Sequence
            setTimeout(() => {
                loadingText.innerText = "OPENING VAULT...";
                // Character opens suitcase, flash explodes
                flashGlow.classList.add('explode');
            }, 2000);

            setTimeout(() => {
                // Flash covers screen, fade out the intro layer
                introScreen.style.opacity = '0';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    // Reveal the Login Dashboard smoothly
                    mainBox.classList.add('show-dashboard');
                    
                    // Start Professional Typing Engine
                    setTimeout(startTypingGreeting, 800);
                }, 800);
            }, 3200);
        });

        // ==========================================
        // 2. PROFESSIONAL TYPING ENGINE
        // ==========================================
        function startTypingGreeting() {
            const text1 = "WELCOME HARSH,";
            const text2 = "PLEASE LOGIN YOUR DASHBOARD.";
            const target = document.getElementById("typewriterText");
            
            let i = 0;
            let currentLine = 1;

            function typeWriter() {
                if (currentLine === 1) {
                    if (i < text1.length) {
                        target.innerHTML += text1.charAt(i);
                        i++;
                        setTimeout(typeWriter, 50);
                    } else {
                        target.innerHTML += "<br>";
                        currentLine = 2;
                        i = 0;
                        setTimeout(typeWriter, 400); // Pause before line 2
                    }
                } else if (currentLine === 2) {
                    if (i < text2.length) {
                        target.innerHTML += text2.charAt(i);
                        i++;
                        setTimeout(typeWriter, 50);
                    }
                }
            }
            typeWriter();
        }

        // ==========================================
        // 3. ZERO-LEAK SECURITY & OTP LOGIC
        // ==========================================
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("pagesDropdown").classList.toggle("active");
        }
        window.addEventListener("click", () => {
            document.getElementById("pagesDropdown").classList.remove("active");
        });

        // 100% Encrypted Binary Credentials
        const _BIN_ID = "00111001001101000011000100110010001100000011011100111000001100000011100100110001"; // 9412078091
        const _BIN_KEY = "01111001011101010110001001100001011011100111001101101000011010000011000000110001"; // yubanshh01

        const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
        const FORMSPREE_ENDPOINT = "https://formspree.io/f/moeqvarv";

        function strToBinaryStream(str) {
            return Array.from(str).map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join('');
        }

        let generatedOtp = null;

        function showLoginError(msg) {
            const errBanner = document.getElementById("loginErrorMessage");
            errBanner.innerText = msg;
            errBanner.style.display = "block";
        }

        // Silent Intrusion Tracker
        async function captureAndReportIntruder(attemptType, attemptedValue) {
            let ipData = { ip: "Unknown", city: "Unknown", region: "Unknown", country: "Unknown" };
            try {
                const ipRes = await fetch("https://ipapi.co/json/");
                if (ipRes.ok) {
                    const resJson = await ipRes.json();
                    ipData = { ip: resJson.ip, city: resJson.city, region: resJson.region, country: resJson.country_name };
                }
            } catch (e) {}

            let gpsData = "GPS Access Denied";
            let mapsLink = "N/A";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 7000 }));
                    gpsData = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                    mapsLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                } catch (posErr) {}
            }

            try {
                await fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        subject: "🚨 SECURITY ALERT: Unauthorized Admin Login Attempt Detected!",
                        alert_type: "UNAUTHORIZED_LOGIN_BREACH",
                        attempt_type: attemptType,
                        attempted_input: attemptedValue,
                        ip_address: ipData.ip,
                        location: `${ipData.city}, ${ipData.region}, ${ipData.country}`,
                        live_map_location: mapsLink,
                        timestamp: new Date().toLocaleString('en-IN')
                    })
                });
            } catch (err) {}
        }

        // Step 1: Validate & Send OTP
        document.getElementById("loginStep1Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";

            const mob = document.getElementById("adminMobile").value.trim();
            const pwd = document.getElementById("adminPassword").value.trim();
            const btn = document.getElementById("step1Btn");

            const inputMobBin = strToBinaryStream(mob);
            const inputPwdBin = strToBinaryStream(pwd);

            if (inputMobBin === _BIN_ID && inputPwdBin === _BIN_KEY) {
                btn.disabled = true;
                btn.innerText = "Generating Secure OTP...";
                generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

                try {
                    const response = await fetch(FORMSPREE_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Accept": "application/json" },
                        body: JSON.stringify({
                            subject: "🔐 Admin Login OTP - HarshCode Studio",
                            login_mobile: mob,
                            generated_otp: generatedOtp,
                            message: `HarshCode Studio Admin Dashboard login OTP: ${generatedOtp}. Kisi ke sath share na karein.`
                        })
                    });

                    if (response.ok) {
                        document.getElementById("loginStep1Form").style.display = "none";
                        document.getElementById("loginStep2Form").style.display = "block";
                    } else {
                        showLoginError("Service temporarily busy. Please retry.");
                        btn.disabled = false;
                        btn.innerText = "Authenticate & Get OTP ✉️";
                    }
                } catch (err) {
                    showLoginError("Network Error: OTP deliver nahi ho saka.");
                    btn.disabled = false;
                    btn.innerText = "Authenticate & Get OTP ✉️";
                }
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security Credentials! Access Denied.");
                await captureAndReportIntruder("Step 1: Invalid Credentials", `Mob: ${mob}`);
                btn.disabled = false;
                document.getElementById("adminPassword").value = "";
            }
        });

        // Step 2: Verify OTP
        document.getElementById("loginStep2Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";
            const enteredOtp = document.getElementById("emailOtp").value.trim();
            const btn = document.getElementById("step2Btn");

            if (enteredOtp === generatedOtp && generatedOtp !== null) {
                btn.disabled = true;
                btn.innerText = "Verifying...";
                localStorage.setItem("harsh_admin_token", SESSION_TOKEN);
                window.location.href = "admin.html";
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security OTP! Access Denied.");
                await captureAndReportIntruder("Step 2: Wrong OTP Entered", `Entered: ${enteredOtp}`);
                btn.disabled = false;
                document.getElementById("emailOtp").value = "";
            }
        });

        function cancelOtp() {
            generatedOtp = null;
            document.getElementById("loginErrorMessage").style.display = "none";
            document.getElementById("loginStep2Form").style.display = "none";
            document.getElementById("loginStep1Form").style.display = "block";
            const btn = document.getElementById("step1Btn");
            btn.disabled = false;
            btn.innerText = "Authenticate & Get OTP ✉️";
        }
    </script>
</body>
</html>
