<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HarshCode Studio</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. VIDEO REFERENCE THEME & LAYOUT
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            background: #5a67d8; /* Matching the video's blue background */
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-direction: column;
        }

        .main-animation-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 50px;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        /* =========================================
           2. CHARACTER WALK-IN ANIMATION
           ========================================= */
        .character-box {
            width: 250px;
            transform: translateX(-100vw);
            /* Character comes in first */
            animation: walkIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            position: relative;
            z-index: 2;
        }

        .character-box img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 15px rgba(0,0,0,0.3));
        }

        @keyframes walkIn {
            0% { transform: translateX(-100vw) rotate(-5deg); }
            80% { transform: translateX(10px) rotate(2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        /* =========================================
           3. FORM DROP-DOWN ANIMATION
           ========================================= */
        .form-box {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            transform: translateY(-100vh);
            opacity: 0;
            /* Form drops down AFTER character arrives (1.5s delay) */
            animation: dropDownForm 1s 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 1;
        }

        @keyframes dropDownForm {
            0% { transform: translateY(-100vh); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Form Styling */
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            margin: 0;
            color: #1e293b;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .form-header p {
            margin: 5px 0 0 0;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .form-group input:focus {
            border-color: #5a67d8;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(90, 103, 216, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: #5a67d8;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #434ce6;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(90, 103, 216, 0.3);
        }

        .step-2-otp { display: none; }
        
        .auth-error-banner {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover { color: #5a67d8; }

        @media (max-width: 768px) {
            .main-animation-container { flex-direction: column; align-items: center; gap: 20px; }
            .character-box { width: 180px; }
            .form-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="main-animation-container">
        
        <!-- 3D Character Walking In -->
        <div class="character-box">
            <!-- Maine yahan ek high-quality 3D character placeholder diya hai. Agar aapko chalta hua GIF mile toh aap src link badal sakte hain -->
            <img src="https://cdn3d.iconscout.com/3d/premium/thumb/businessman-holding-briefcase-5065977-4225251.png" alt="3D Character">
        </div>

        <!-- Form Dropping Down -->
        <div class="form-box">
            <div class="form-header">
                <h2>Admin Panel</h2>
                <p>Secure your spot in the dashboard</p>
            </div>

            <div id="loginErrorMessage" class="auth-error-banner"></div>

            <!-- Step 1: Mobile & Password -->
            <form id="loginStep1Form">
                <div class="form-group">
                    <label for="adminMobile">Registered Mobile Number *</label>
                    <input type="tel" id="adminMobile" placeholder="Enter mobile number" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Master Password *</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" id="step1Btn" class="btn-submit">Authenticate Account</button>
            </form>

            <!-- Step 2: OTP Verification -->
            <form id="loginStep2Form" class="step-2-otp">
                <div class="form-group">
                    <label for="emailOtp" style="text-align: center;">Enter 6-Digit Email OTP *</label>
                    <input type="text" id="emailOtp" placeholder="••••••" maxlength="6" required style="font-family: 'Fira Code', monospace; font-size: 1.5rem; letter-spacing: 10px; text-align: center;">
                </div>
                <button type="submit" id="step2Btn" class="btn-submit" style="background: #10b981;">Verify OTP & Login</button>
                <button type="button" onclick="cancelOtp()" style="background: none; border: none; width: 100%; margin-top: 15px; color: #64748b; font-weight: 600; cursor: pointer;">← Go Back</button>
            </form>

            <a href="index.html" class="back-link">Return to Home Page</a>
        </div>

    </div>

    <!-- Security & Logic Engine -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
            if (localStorage.getItem("harsh_admin_token") === SESSION_TOKEN) {
                window.location.href = "admin.html";
            }
        });

        const _BIN_ID = "00111001001101000011000100110010001100000011011100111000001100000011100100110001"; // 9412078091
        const _BIN_KEY = "01111001011101010110001001100001011011100111001101101000011010000011000000110001"; // yubanshh01
        const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
        const FORMSPREE_ENDPOINT = "https://formspree.io/f/moeqvarv";

        function strToBinaryStream(str) {
            return Array.from(str).map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join('');
        }

        let generatedOtp = null;

        function showLoginError(msg) {
            const errBanner = document.getElementById("loginErrorMessage");
            errBanner.innerText = msg;
            errBanner.style.display = "block";
        }

        async function captureAndReportIntruder(attemptType, attemptedValue) {
            let ipData = { ip: "Unknown", city: "Unknown", region: "Unknown", country: "Unknown" };
            try {
                const ipRes = await fetch("https://ipapi.co/json/");
                if (ipRes.ok) {
                    const resJson = await ipRes.json();
                    ipData = { ip: resJson.ip, city: resJson.city, region: resJson.region, country: resJson.country_name };
                }
            } catch (e) {}

            let gpsData = "GPS Access Denied";
            let mapsLink = "N/A";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 7000 }));
                    gpsData = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                    mapsLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                } catch (posErr) {}
            }

            try {
                await fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        subject: "🚨 SECURITY ALERT: Unauthorized Admin Login Attempt Detected!",
                        alert_type: "UNAUTHORIZED_LOGIN_BREACH",
                        attempt_type: attemptType,
                        attempted_input: attemptedValue,
                        ip_address: ipData.ip,
                        location: `${ipData.city}, ${ipData.region}, ${ipData.country}`,
                        live_map_location: mapsLink,
                        timestamp: new Date().toLocaleString('en-IN')
                    })
                });
            } catch (err) {}
        }

        document.getElementById("loginStep1Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";

            const mob = document.getElementById("adminMobile").value.trim();
            const pwd = document.getElementById("adminPassword").value.trim();
            const btn = document.getElementById("step1Btn");

            const inputMobBin = strToBinaryStream(mob);
            const inputPwdBin = strToBinaryStream(pwd);

            if (inputMobBin === _BIN_ID && inputPwdBin === _BIN_KEY) {
                btn.disabled = true;
                btn.innerText = "Sending Secure OTP...";
                generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

                try {
                    const response = await fetch(FORMSPREE_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Accept": "application/json" },
                        body: JSON.stringify({
                            subject: "🔐 Admin Login OTP - HarshCode Studio",
                            login_mobile: mob,
                            generated_otp: generatedOtp,
                            message: `HarshCode Studio Admin Dashboard login OTP: ${generatedOtp}. Kisi ke sath share na karein.`
                        })
                    });

                    if (response.ok) {
                        document.getElementById("loginStep1Form").style.display = "none";
                        document.getElementById("loginStep2Form").style.display = "block";
                    } else {
                        showLoginError("Service temporarily busy. Please retry.");
                        btn.disabled = false;
                        btn.innerText = "Authenticate Account";
                    }
                } catch (err) {
                    showLoginError("Network Error: OTP deliver nahi ho saka.");
                    btn.disabled = false;
                    btn.innerText = "Authenticate Account";
                }
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security Credentials! Access Denied.");
                await captureAndReportIntruder("Step 1: Invalid Credentials", `Mob: ${mob}`);
                btn.disabled = false;
                document.getElementById("adminPassword").value = "";
            }
        });

        document.getElementById("loginStep2Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";
            const enteredOtp = document.getElementById("emailOtp").value.trim();
            const btn = document.getElementById("step2Btn");

            if (enteredOtp === generatedOtp && generatedOtp !== null) {
                btn.disabled = true;
                btn.innerText = "Verifying...";
                localStorage.setItem("harsh_admin_token", SESSION_TOKEN);
                window.location.href = "admin.html";
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security OTP! Access Denied.");
                await captureAndReportIntruder("Step 2: Wrong OTP Entered", `Entered: ${enteredOtp}`);
                btn.disabled = false;
                document.getElementById("emailOtp").value = "";
            }
        });

        function cancelOtp() {
            generatedOtp = null;
            document.getElementById("loginErrorMessage").style.display = "none";
            document.getElementById("loginStep2Form").style.display = "none";
            document.getElementById("loginStep1Form").style.display = "block";
            const btn = document.getElementById("step1Btn");
            btn.disabled = false;
            btn.innerText = "Authenticate Account";
        }
    </script>
</body>
</html>
