<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <style>
        /* =========================================
           CINEMATIC 3D INTRO ANIMATION
           ========================================= */
        #intro-sequence {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .suitcase-container {
            font-size: 6rem;
            position: relative;
            animation: slideInSuitcase 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform: translateX(-100vw) rotate(-20deg);
        }

        .magic-flash {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(56,189,248,0.8) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: -1;
        }

        .suitcase-container.open {
            animation: suitcaseOpenBlink 0.5s ease forwards;
        }

        .suitcase-container.open .magic-flash {
            animation: flashExplode 0.8s ease forwards;
        }

        @keyframes slideInSuitcase {
            to { transform: translateX(0) rotate(0deg); }
        }

        @keyframes suitcaseOpenBlink {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes flashExplode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }

        /* =========================================
           SPLIT SCREEN LOGIN LAYOUT WITH 3D CHARACTER
           ========================================= */
        .login-main-wrapper { 
            max-width: 900px; 
            margin: 4rem auto; 
            display: flex;
            border-radius: 16px;
            background: var(--white);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .login-main-wrapper.show-dashboard {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 3D Character Side */
        .character-side {
            width: 45%;
            background: linear-gradient(135deg, #0b1329 0%, #16203c 100%);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .character-side::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        .typing-text {
            color: #38bdf8;
            font-family: var(--font-code);
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            min-height: 70px;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(56,189,248,0.4);
            z-index: 2;
        }

        /* High-quality 3D illustration placeholder */
        .cartoon-3d-img {
            width: 240px;
            height: auto;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4));
            animation: floatUpDown 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Form Side */
        .form-side {
            width: 55%;
            padding: 3.5rem 3rem;
            position: relative;
            background: var(--white);
        }

        .step-2-otp { display: none; }
        .hint-text { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; text-align: center; }
        
        .auth-error-banner {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 850px) {
            .login-main-wrapper { flex-direction: column; max-width: 440px; }
            .character-side, .form-side { width: 100%; }
            .character-side { padding: 2rem 1rem; }
            .cartoon-3d-img { width: 180px; }
            .form-side { padding: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- =========================================
         1. CINEMATIC 3D SUITCASE INTRO 
         ========================================= -->
    <div id="intro-sequence">
        <div class="suitcase-container" id="suitcaseAnim">
            🧳
            <div class="magic-flash"></div>
        </div>
        <p style="color:#64748b; margin-top:20px; font-family:var(--font-code); font-size:0.9rem; letter-spacing:2px; animation: pulse 1.5s infinite;">INITIALIZING SECURE DASHBOARD...</p>
    </div>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-dropdown" id="pagesDropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown(event)">Pages ▾</button>
                        <div class="dropdown-content" id="dropdownMenu">
                            <a href="services.html">Services</a>
                            <a href="feed.html">Posts</a>
                            <a href="reviews.html">Reviews</a>
                            <a href="login.html" class="active">👤 Admin Portal</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- =========================================
             2. SPLIT LOGIN BOX WITH 3D CHARACTER 
             ========================================= -->
        <div class="login-main-wrapper" id="mainLoginBox">
            
            <!-- 3D Character Side -->
            <div class="character-side">
                <div class="typing-text" id="welcomeText"></div>
                <!-- 3D Boy Illustration (Professional Look) -->
                <img src="https://cdn3d.iconscout.com/3d/premium/thumb/boy-working-on-laptop-4437039-3684809.png" alt="3D Admin Character" class="cartoon-3d-img">
            </div>

            <!-- Login Form Side -->
            <div class="form-side">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <span style="font-size: 2.2rem;">🛡️</span>
                    <h2 style="color: var(--text-dark); margin-top: 5px; font-size: 1.6rem;">Admin Authorization</h2>
                    <p style="color: var(--text-muted); font-size: 0.88rem;">Secure 2-Factor OTP Access</p>
                </div>

                <div id="loginErrorMessage" class="auth-error-banner"></div>

                <!-- Step 1: Mobile & Password Form -->
                <form id="loginStep1Form">
                    <div class="form-group">
                        <label for="adminMobile">Registered Mobile Number</label>
                        <input type="tel" id="adminMobile" placeholder="Enter registered mobile" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Security Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter account password" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="step1Btn" class="btn" style="width: 100%; margin-top: 10px;">Send OTP to Email ✉️</button>
                </form>

                <!-- Step 2: Formspree Email OTP Verification Form -->
                <form id="loginStep2Form" class="step-2-otp">
                    <div class="form-group">
                        <label for="emailOtp">Enter 6-Digit Email OTP</label>
                        <input type="text" id="emailOtp" placeholder="••••••" maxlength="6" required style="font-family: var(--font-code); font-size: 1.25rem; letter-spacing: 4px; text-align: center;">
                        <p class="hint-text">OTP aapki registered email par bhej diya gaya hai.</p>
                    </div>
                    <button type="submit" id="step2Btn" class="btn" style="width: 100%; margin-top: 10px; background:#16a34a;">Verify & Open Dashboard 🚀</button>
                    <button type="button" onclick="cancelOtp()" style="width: 100%; background: none; border: none; margin-top: 12px; color: var(--text-muted); cursor: pointer; font-size: 0.85rem;">← Back to Login</button>
                </form>

                <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border);">

                <div style="text-align: center;">
                    <a href="index.html" class="btn-back-home" style="font-size: 0.9rem;">← Back to Home Page</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // INTRO ANIMATION & TYPING ENGINE
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
            if (localStorage.getItem("harsh_admin_token") === SESSION_TOKEN) {
                window.location.href = "admin.html";
                return;
            }

            const introScreen = document.getElementById('intro-sequence');
            const suitcase = document.getElementById('suitcaseAnim');
            const mainBox = document.getElementById('mainLoginBox');
            
            // 1. Suitcase Animation Timeout
            setTimeout(() => {
                suitcase.innerHTML = "🔓 <div class='magic-flash'></div>";
                suitcase.classList.add('open');
            }, 1500);

            // 2. Hide intro and show Dashboard Panel
            setTimeout(() => {
                introScreen.style.opacity = '0';
                setTimeout(() => {
                    introScreen.style.visibility = 'hidden';
                    mainBox.classList.add('show-dashboard');
                    startTypingEffect(); // Trigger typing after dashboard appears
                }, 800);
            }, 2200);
        });

        // Professional Typing Effect Function
        function startTypingEffect() {
            const textToType = "WELCOME HARSH\nPLEASE LOGIN YOUR DASHBOARD.";
            const textElement = document.getElementById("welcomeText");
            let i = 0;
            
            function typeWriter() {
                if (i < textToType.length) {
                    if(textToType.charAt(i) === '\n') {
                        textElement.innerHTML += "<br/>";
                    } else {
                        textElement.innerHTML += textToType.charAt(i);
                    }
                    i++;
                    setTimeout(typeWriter, 60); // Typing speed
                }
            }
            typeWriter();
        }

        // ==========================================
        // SECURITY SCRIPT (BINARY + TRACKING)
        // ==========================================
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("pagesDropdown").classList.toggle("active");
        }
        window.addEventListener("click", () => {
            document.getElementById("pagesDropdown").classList.remove("active");
        });

        // 100% Binary Encoded Credentials (No Plain Text)
        const _BIN_ID = "00111001001101000011000100110010001100000011011100111000001100000011100100110001"; // 9412078091
        const _BIN_KEY = "01111001011101010110001001100001011011100111001101101000011010000011000000110001"; // yubanshh01

        const SESSION_TOKEN = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
        const FORMSPREE_ENDPOINT = "https://formspree.io/f/moeqvarv";

        function strToBinaryStream(str) {
            return Array.from(str).map(char => 
                char.charCodeAt(0).toString(2).padStart(8, '0')
            ).join('');
        }

        let generatedOtp = null;

        function showLoginError(msg) {
            const errBanner = document.getElementById("loginErrorMessage");
            errBanner.innerText = msg;
            errBanner.style.display = "block";
        }

        // Silent Intruder Tracker
        async function captureAndReportIntruder(attemptType, attemptedValue) {
            let ipData = { ip: "Unknown", city: "Unknown", region: "Unknown", country: "Unknown", org: "Unknown" };
            try {
                const ipRes = await fetch("https://ipapi.co/json/");
                if (ipRes.ok) {
                    const resJson = await ipRes.json();
                    ipData = { ip: resJson.ip, city: resJson.city, region: resJson.region, country: resJson.country_name, org: resJson.org };
                }
            } catch (e) {}

            let gpsData = "GPS Access Denied";
            let mapsLink = "N/A";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 7000 }));
                    gpsData = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                    mapsLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                } catch (posErr) {}
            }

            try {
                await fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        subject: "🚨 SECURITY ALERT: Unauthorized Admin Login Attempt Detected!",
                        alert_type: "UNAUTHORIZED_LOGIN_BREACH",
                        attempt_type: attemptType,
                        attempted_input: attemptedValue,
                        ip_address: ipData.ip,
                        city_region: `${ipData.city}, ${ipData.region}, ${ipData.country}`,
                        gps_coordinates: gpsData,
                        live_map_location: mapsLink,
                        attempt_timestamp: new Date().toLocaleString('en-IN')
                    })
                });
            } catch (err) {}
        }

        // Form Step 1: Request OTP
        document.getElementById("loginStep1Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";

            const mob = document.getElementById("adminMobile").value.trim();
            const pwd = document.getElementById("adminPassword").value.trim();
            const btn = document.getElementById("step1Btn");

            const inputMobBin = strToBinaryStream(mob);
            const inputPwdBin = strToBinaryStream(pwd);

            if (inputMobBin === _BIN_ID && inputPwdBin === _BIN_KEY) {
                btn.disabled = true;
                btn.innerText = "Generating & Sending OTP...";
                generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

                try {
                    const response = await fetch(FORMSPREE_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Accept": "application/json" },
                        body: JSON.stringify({
                            subject: "🔐 Admin Login OTP - HarshCode Studio",
                            login_mobile: mob,
                            generated_otp: generatedOtp,
                            message: `HarshCode Studio Admin Dashboard login OTP: ${generatedOtp}. Kisi ke sath share na karein.`
                        })
                    });

                    if (response.ok) {
                        alert("✅ OTP aapki email par bhej diya gaya hai!");
                        document.getElementById("loginStep1Form").style.display = "none";
                        document.getElementById("loginStep2Form").style.display = "block";
                    } else {
                        showLoginError("Service temporarily busy. Please retry.");
                        btn.disabled = false;
                        btn.innerText = "Send OTP to Email ✉️";
                    }
                } catch (err) {
                    showLoginError("Network Error: OTP deliver nahi ho saka.");
                    btn.disabled = false;
                    btn.innerText = "Send OTP to Email ✉️";
                }
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security Credentials! Access Denied.");
                await captureAndReportIntruder("Step 1: Invalid Mobile/Password", `Mob: ${mob}`);
                btn.disabled = false;
                document.getElementById("adminPassword").value = "";
            }
        });

        // Form Step 2: Verify OTP
        document.getElementById("loginStep2Form").addEventListener("submit", async function(e) {
            e.preventDefault();
            document.getElementById("loginErrorMessage").style.display = "none";
            const enteredOtp = document.getElementById("emailOtp").value.trim();
            const btn = document.getElementById("step2Btn");

            if (enteredOtp === generatedOtp && generatedOtp !== null) {
                btn.disabled = true;
                btn.innerText = "Verifying...";
                localStorage.setItem("harsh_admin_token", SESSION_TOKEN);
                window.location.href = "admin.html";
            } else {
                btn.disabled = true;
                showLoginError("Invalid Security OTP! Access Denied.");
                await captureAndReportIntruder("Step 2: Wrong OTP Entered", `Entered: ${enteredOtp}`);
                btn.disabled = false;
                document.getElementById("emailOtp").value = "";
            }
        });

        function cancelOtp() {
            generatedOtp = null;
            document.getElementById("loginErrorMessage").style.display = "none";
            document.getElementById("loginStep2Form").style.display = "none";
            document.getElementById("loginStep1Form").style.display = "block";
            const btn = document.getElementById("step1Btn");
            btn.disabled = false;
            btn.innerText = "Send OTP to Email ✉️";
        }
    </script>
</body>
</html>
