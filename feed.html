<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts & Updates | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="feed.html" class="active">Posts</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">👤 Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 800px;">
            <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
                <h2>Latest Posts & Updates</h2>
                <p style="color: var(--text-muted); margin-top: 4px;">Projects, announcements aur technical updates by Harsh Chaudhary Tomar.</p>
            </div>
            <div id="publicPostsContainer">
                <!-- Live Posts load yahan hongi -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved. Designed by Harsh Chaudhary Tomar.</p>
            </div>
        </div>
    </footer>

    <script>
        // Activated Supabase Config
        const SUPABASE_URL = "https://rbbryqshvycrstzrtytp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYnJ5cXNodnljcnN0enJ0eXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTI1MjYsImV4cCI6MjEwNDI4ODUyNn0.WzH2ju9G2nW8iOKnh77OFF0N3G0ECHx1iLBjcPISItc";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPublicPosts() {
            const container = document.getElementById("publicPostsContainer");
            container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Fetching live updates...</p>";

            try {
                const { data: posts, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                container.innerHTML = "";

                if (!posts || posts.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No posts published yet.</p>";
                    return;
                }

                posts.forEach(post => {
                    container.innerHTML += `
                        <article class="post-card">
                            <div class="post-header">
                                <span class="post-tag">${post.tag}</span>
                                <span class="post-date">📅 ${post.date}</span>
                            </div>
                            <h3 style="font-size:1.3rem; margin-bottom: 0.5rem; color: var(--text-dark);">${post.title}</h3>
                            ${post.img ? `
                                <div class="post-img-wrapper">
                                    <img src="${post.img}" class="post-img" alt="${post.title}" loading="lazy">
                                </div>` : ''}
                            <p style="color:#334155; line-height: 1.6; margin-top: 10px;">${post.content}</p>
                        </article>
                    `;
                });
            } catch (err) {
                container.innerHTML = "<p style='text-align:center; color:red;'>Failed to load live feed: " + err.message + "</p>";
            }
        }

        loadPublicPosts();
    </script>
</body>
</html>
