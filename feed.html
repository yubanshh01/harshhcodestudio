<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts & Updates | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="feed.html" class="active">Posts</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">👤 Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container" style="max-width: 800px;">
            <div class="section-header">
                <h2>Latest Posts & Updates</h2>
                <p>Projects, announcements aur technical updates by Harsh Chaudhary Tomar.</p>
            </div>
            <div id="publicPostsContainer">
                <!-- Posts yahan load hongi -->
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved. Designed by Harsh Chaudhary Tomar.</p>
            </div>
        </div>
    </footer>

    <script>
        const JSONBIN_MASTER_KEY = "$2a$10$yc6L6sWapiapx/aXSdMlC.Vz857xathnwUfmAEG1BqrSJmn/k/jXS"; // Data Cloud
        const JSONBIN_BIN_NAME = "studio_feed"; // Your Bin Name

        async function loadPublicPosts() {
            const container = document.getElementById("publicPostsContainer");
            container.innerHTML = "<p style='text-align:center;'>Fetching live updates...</p>";

            try {
                // Fetch dynamic data from JSONBin (Cloud Storage)
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_NAME}`, {
                    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
                });
                
                const posts = (await res.json()).record;
                container.innerHTML = "";

                if (!posts || posts.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>No posts published yet.</p>";
                    return;
                }

                posts.forEach(post => {
                    container.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <span class="post-tag">${post.tag}</span>
                                <span class="post-date">📅 ${post.date}</span>
                            </div>
                            <h3 style="font-size:1.3rem; margin-bottom: 0.5rem; color: var(--text-dark);">${post.title}</h3>
                            ${post.img ? `
                                <div class="post-img-wrapper">
                                    <img src="${post.img}" class="post-img" alt="${post.title}">
                                </div>` : ''}
                            <p style="color:#334155; line-height: 1.6; margin-top: 10px;">${post.content}</p>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = "<p style='text-align:center; color:red;'>Failed to load live feed.</p>";
            }
        }
        loadPublicPosts();
    </script>
</body>
</html>
