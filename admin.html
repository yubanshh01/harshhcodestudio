<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header (Standard Menu Bar) -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="feed.html">Posts</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admin.html" class="active">👤 Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            
            <!-- Dashboard Top Controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; background: var(--white); padding: 1.2rem 1.5rem; border-radius: 10px; border: 1px solid var(--border);">
                <div>
                    <h2 style="font-size: 1.4rem; color: var(--primary);">Admin Dashboard</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Cloud Sync Mode (JSONBin + ImgBB)</p>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <a href="index.html" class="btn-back-home">← Back to Home</a>
                    <a href="feed.html" class="btn btn-outline" target="_blank">View Live Feed</a>
                    <button onclick="logout()" class="btn" style="background:#dc2626; padding: 8px 14px;">Logout 🚪</button>
                </div>
            </div>

            <!-- Create Post Card -->
            <div class="card" style="max-width: 700px; margin: 0 auto 2.5rem auto;">
                <h3>Create New Public Post (Cloud Mode)</h3>
                <form id="postForm" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Post Title</label>
                        <input type="text" id="postTitle" placeholder="e.g. New Project Completed!" required>
                    </div>
                    <div class="form-group">
                        <label>Category / Tag</label>
                        <select id="postTag">
                            <option>Web Project</option>
                            <option>Announcement</option>
                            <option>Coding Tip</option>
                            <option>Personal Update</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Upload Photo (Device se Photo Chunein)</label>
                        <input type="file" id="postFileInput" accept="image/*" style="background: var(--bg-light); cursor: pointer;" required>
                        <div id="previewContainer" style="display:none; margin-top: 10px; background:#0f172a; border-radius:8px; padding:6px; text-align:center;">
                            <img id="imagePreview" style="max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Post Description</label>
                        <textarea id="postContent" rows="4" placeholder="Apna message yahan likhein..." required></textarea>
                    </div>
                    <button type="submit" id="publishBtn" class="btn" style="width: 100%;">Publish Live Post 🚀</button>
                </form>
            </div>

            <h3 style="margin-bottom: 1rem;">Manage Published Posts</h3>
            <div id="adminPostsList"></div>
        </div>
    </section>

    <script>
        // Check Session
        if (localStorage.getItem("harsh_admin_logged") !== "true") {
            alert("Unauthorized Access!");
            window.location.href = "login.html";
        }
        function logout() {
            localStorage.removeItem("harsh_admin_logged");
            window.location.href = "login.html";
        }

        // Cloud Credentials (UPDATE THESE)
        const IMGBB_KEY = "0c5399cbb18180807f4801526ca5ed42"; // Photo Cloud
        const JSONBIN_MASTER_KEY = "$2a$10$s0ui3ESW0cXraUgdQYbTB.iE4plFNtO5bD1A7p0IBWoiMk42r1hme"; // Data Cloud
        const JSONBIN_BIN_NAME = "studio_feed"; // Choose a unique name for your bin

        // Constants
        const JSONBIN_COLLECTION_URL = `https://api.jsonbin.io/v3/b`;

        let selectedFile = null;

        // Image Preview
        document.getElementById("postFileInput").addEventListener("change", function(e) {
            selectedFile = e.target.files[0];
            const preview = document.getElementById("imagePreview");
            const previewContainer = document.getElementById("previewContainer");
            
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    previewContainer.style.display = "block";
                };
                reader.readAsDataURL(selectedFile);
            } else {
                previewContainer.style.display = "none";
            }
        });

        // 1. Post to Cloud (ImgBB -> JSONBin)
        document.getElementById("postForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const publishBtn = document.getElementById("publishBtn");
            publishBtn.disabled = true;
            publishBtn.innerText = "Step 1: Uploading Photo...";

            // --- A. Upload to ImgBB ---
            const imageData = new FormData();
            imageData.append("image", selectedFile);
            let uploadedImageUrl = "";

            try {
                const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                    method: "POST",
                    body: imageData
                });
                const imgbbData = await imgbbResponse.json();
                if (!imgbbData.success) throw new Error(imgbbData.error.message);
                uploadedImageUrl = imgbbData.data.url;

                publishBtn.innerText = "Step 2: Saving to Database...";

                // --- B. Save to JSONBin (Sync Mode) ---
                const newPost = {
                    title: document.getElementById("postTitle").value.trim(),
                    tag: document.getElementById("postTag").value,
                    img: uploadedImageUrl, // Permanent Direct Link
                    content: document.getElementById("postContent").value.trim(),
                    date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                    timestamp: Date.now()
                };

                // Fetch current posts first
                const currentRes = await fetch(`${JSONBIN_COLLECTION_URL}/${JSONBIN_BIN_NAME}`, {
                    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
                });
                let postsArray = [];
                if (currentRes.ok) {
                    postsArray = (await currentRes.json()).record;
                }

                // Add new to beginning
                postsArray.unshift(newPost);

                // Update whole bin (PUT Request)
                const updateRes = await fetch(`${JSONBIN_COLLECTION_URL}/${JSONBIN_BIN_NAME}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify(postsArray)
                });

                if (updateRes.ok) {
                    alert("Post is live on all devices! 🚀");
                    this.reset();
                    document.getElementById("previewContainer").style.display = "none";
                    loadAdminPosts();
                } else {
                    throw new Error("JSONBin Save Failed.");
                }
            } catch (err) {
                alert("Cloud Error: " + err.message);
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerText = "Publish Live Post 🚀";
            }
        });

        // Load & Delete
        async function loadAdminPosts() {
            const container = document.getElementById("adminPostsList");
            container.innerHTML = "Fetching posts from database...";

            try {
                const res = await fetch(`${JSONBIN_COLLECTION_URL}/${JSONBIN_BIN_NAME}`, {
                    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
                });
                const posts = (await res.json()).record;
                container.innerHTML = "";

                if (!posts || posts.length === 0) {
                    container.innerHTML = "<p>No posts on cloud.</p>";
                    return;
                }

                posts.forEach(post => {
                    container.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <div><span class="post-tag">${post.tag}</span><h3 style="margin-top:6px;">${post.title}</h3></div>
                                <button onclick="deleteCloudPost(${post.timestamp})" class="btn" style="background:#ef4444; padding: 6px 12px; font-size:0.85rem;">Delete</button>
                            </div>
                            <div class="post-date">📅 ${post.date}</div>
                            ${post.img ? `<div class="post-img-wrapper"><img src="${post.img}" class="post-img" alt="Post Photo"></div>` : ''}
                            <p style="margin-top:10px; color:#334155;">${post.content}</p>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = "Failed to load posts.";
            }
        }

        async function deleteCloudPost(timestamp) {
            if (!confirm("Confirm Delete from Cloud?")) return;
            try {
                // Fetch current
                const currentRes = await fetch(`${JSONBIN_COLLECTION_URL}/${JSONBIN_BIN_NAME}`, {
                    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
                });
                let postsArray = (await currentRes.json()).record;

                // Filter out
                postsArray = postsArray.filter(p => p.timestamp !== timestamp);

                // Update whole bin
                await fetch(`${JSONBIN_COLLECTION_URL}/${JSONBIN_BIN_NAME}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify(postsArray)
                });
                loadAdminPosts();
            } catch (err) {
                alert("Delete Failed: " + err.message);
            }
        }
        loadAdminPosts();
    </script>
</body>
</html>
