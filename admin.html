<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="feed.html">Posts</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admin.html" class="active">👤 Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; background: var(--white); padding: 1.2rem 1.5rem; border-radius: 10px; border: 1px solid var(--border);">
                <div>
                    <h2 style="font-size: 1.4rem; color: var(--primary);">Admin Dashboard</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">One-Step Instant Live Sync</p>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <a href="index.html" class="btn-back-home">← Back to Home</a>
                    <a href="feed.html" class="btn btn-outline" target="_blank">View Live Feed</a>
                    <button onclick="logout()" class="btn" style="background:#dc2626; padding: 8px 14px;">Logout 🚪</button>
                </div>
            </div>

            <!-- Create Post Card -->
            <div class="card" style="max-width: 700px; margin: 0 auto 2.5rem auto;">
                <h3>Create New Public Post</h3>
                <form id="postForm" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Post Title</label>
                        <input type="text" id="postTitle" placeholder="e.g. New Project Completed!" required>
                    </div>
                    <div class="form-group">
                        <label>Category / Tag</label>
                        <select id="postTag">
                            <option>Web Project</option>
                            <option>Announcement</option>
                            <option>Coding Tip</option>
                            <option>Personal Update</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Upload Photo</label>
                        <input type="file" id="postFileInput" accept="image/*" style="background: var(--bg-light); cursor: pointer;">
                        <div id="previewContainer" style="display:none; margin-top: 10px; background:#0f172a; border-radius:8px; padding:6px; text-align:center;">
                            <img id="imagePreview" style="max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Post Description</label>
                        <textarea id="postContent" rows="4" placeholder="Apna message yahan likhein..." required></textarea>
                    </div>
                    <button type="submit" id="publishBtn" class="btn" style="width: 100%;">Publish Live Post 🚀</button>
                </form>
            </div>

            <h3 style="margin-bottom: 1rem;">Manage Published Posts</h3>
            <div id="adminPostsList"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved.</p>
                <p><a href="index.html">Home</a> • <a href="feed.html">Live Feed</a></p>
            </div>
        </div>
    </footer>
<script>
    // Apni Pantry ID yahan daalein
    const PANTRY_ID = "d3429f66-e569-4a31-bfdb-48dbade8acc7";
    const API_URL = `https://getpantry.cloud/apiv1/pantry/${d3429f66-e569-4a31-bfdb-48dbade8acc7}/basket/posts`;

    // Session Check
    if (localStorage.getItem("harsh_admin_logged") !== "true") {
        alert("Please login first!");
        window.location.href = "login.html";
    }

    function logout() {
        if (confirm("Logout karna chahte hain?")) {
            localStorage.removeItem("harsh_admin_logged");
            window.location.href = "login.html";
        }
    }

    let photoString = "";

    // Photo Preview & Resize (Taaki fast upload ho)
    document.getElementById("postFileInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                // Photo ko light weight compress karein
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 700;
                const scale = MAX_WIDTH / img.width;
                canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                canvas.height = (img.width > MAX_WIDTH) ? (img.height * scale) : img.height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                photoString = canvas.toDataURL("image/jpeg", 0.7);

                document.getElementById("imagePreview").src = photoString;
                document.getElementById("previewContainer").style.display = "block";
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    // Publish Post
    document.getElementById("postForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const btn = document.getElementById("publishBtn");
        btn.disabled = true;
        btn.innerText = "Publishing to Cloud...";

        try {
            // 1. Get purani posts
            let currentPosts = [];
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const data = await res.json();
                    currentPosts = data.posts || [];
                }
            } catch (err) {
                currentPosts = [];
            }

            // 2. Nayi post add karein
            const newPost = {
                id: Date.now(),
                title: document.getElementById("postTitle").value.trim(),
                tag: document.getElementById("postTag").value,
                img: photoString,
                content: document.getElementById("postContent").value.trim(),
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            currentPosts.unshift(newPost);

            // 3. Save to Pantry
            const saveRes = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ posts: currentPosts })
            });

            if (saveRes.ok) {
                alert("Post har phone me live ho gayi! 🚀");
                this.reset();
                photoString = "";
                document.getElementById("previewContainer").style.display = "none";
                loadPosts();
            } else {
                throw new Error("Cloud save error");
            }
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Publish Live Post 🚀";
        }
    });

    // Load Admin Posts
    async function loadPosts() {
        const container = document.getElementById("adminPostsList");
        container.innerHTML = "<p>Loading posts...</p>";

        try {
            const res = await fetch(API_URL);
            if (!res.ok) {
                container.innerHTML = "<p style='color:var(--text-muted);'>No posts found online.</p>";
                return;
            }

            const data = await res.json();
            const posts = data.posts || [];
            container.innerHTML = "";

            if (posts.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted);'>No posts found.</p>";
                return;
            }

            posts.forEach(post => {
                container.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div>
                                <span class="post-tag">${post.tag}</span>
                                <h3 style="margin-top:4px;">${post.title}</h3>
                            </div>
                            <button onclick="deletePost(${post.id})" class="btn" style="background:#ef4444; padding: 4px 10px; font-size:0.85rem;">Delete</button>
                        </div>
                        <div class="post-date">📅 ${post.date}</div>
                        ${post.img ? `<div class="post-img-wrapper"><img src="${post.img}" class="post-img" alt="Post Photo"></div>` : ''}
                        <p style="margin-top:10px; color:#334155;">${post.content}</p>
                    </div>
                `;
            });
        } catch (e) {
            container.innerHTML = "<p style='color:var(--text-muted);'>No posts found online.</p>";
        }
    }

    // Delete Post
    async function deletePost(postId) {
        if (!confirm("Are you sure?")) return;
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            const updated = (data.posts || []).filter(p => p.id !== postId);

            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ posts: updated })
            });

            loadPosts();
        } catch (err) {
            alert("Delete failed: " + err.message);
        }
    }

    loadPosts();
</script>
  </body>
</html>
