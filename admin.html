<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-dropdown" id="pagesDropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown(event)">Pages ▾</button>
                        <div class="dropdown-content" id="dropdownMenu">
                            <a href="services.html">Services</a>
                            <a href="gallery.html">Gallery</a>
                            <a href="feed.html">Posts</a>
                            <a href="reviews.html">Reviews</a>
                            <a href="admin.html" class="active">👤 Admin Dashboard</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:2rem;background:var(--white);padding:1.2rem 1.5rem;border-radius:14px;box-shadow:0 12px 30px rgba(15,23,42,0.08);">
                <div>
                    <h2 style="font-size:1.4rem;color:var(--text-dark);">Admin Dashboard</h2>
                    <p style="color:var(--text-muted);font-size:0.85rem;">Secure backend auth required before access is granted.</p>
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <a href="index.html" class="btn-back-home">Home</a>
                    <button onclick="logout()" class="btn" style="background:#dc2626;padding:6px 12px;font-size:0.85rem;">Logout 🚪</button>
                </div>
            </div>

            <section class="card" style="max-width:760px; margin:0 auto;">
                <h3>Security Status</h3>
                <div id="adminStatus" style="margin-top:1rem; color:var(--text-dark); line-height:1.7;">
                    Loading authentication state...
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved.</p>
                <p><a href="index.html">Home</a> • <a href="login.html">Admin Login</a></p>
            </div>
        </div>
    </footer>

    <script>
        const AUTH_CONFIG = {
            enabled: false,
            sessionTokenName: 'harsh_admin_token',
            sessionValue: 'replace-with-server-generated-token',
            notice: 'Admin authentication is disabled in this public repository until a secure backend is configured.'
        };

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('pagesDropdown').classList.toggle('active');
        }

        window.addEventListener('click', () => {
            document.getElementById('pagesDropdown').classList.remove('active');
        });

        function logout() {
            localStorage.removeItem(AUTH_CONFIG.sessionTokenName);
            window.location.href = 'login.html';
        }

        function renderDisabledState() {
            const status = document.getElementById('adminStatus');
            status.innerHTML = `
                <p><strong>Access status:</strong> Disabled by default for public repositories.</p>
                <p>${AUTH_CONFIG.notice}</p>
                <p><strong>Required fix:</strong> move admin auth to a real backend service (for example: Node.js/Express, Supabase Auth, Firebase Auth, or another server-side identity provider).</p>
                <p><strong>Important:</strong> never store admin credentials, OTP secrets, or session tokens directly in client-side code.</p>
                <p><a href="login.html" class="btn">Go Back to Login</a></p>
            `;
        }

        (function () {
            const token = localStorage.getItem(AUTH_CONFIG.sessionTokenName);
            if (token !== AUTH_CONFIG.sessionValue || !AUTH_CONFIG.enabled) {
                renderDisabledState();
                return;
            }

            document.getElementById('adminStatus').innerHTML = `
                <p><strong>Access granted.</strong> Backend auth is active.</p>
                <p>Use secure server-side API endpoints to manage posts, images, and admin actions.</p>
            `;
        })();
    </script>
</body>
</html>
