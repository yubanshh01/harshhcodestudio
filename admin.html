<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='images/logo.png'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-dropdown" id="pagesDropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown(event)">Pages ▾</button>
                        <div class="dropdown-content" id="dropdownMenu">
                            <a href="services.html">Services</a>
                            <a href="gallery.html">Gallery</a>
                            <a href="feed.html">Posts</a>
                            <a href="reviews.html">Reviews</a>
                            <a href="admin.html" class="active">👤 Admin Dashboard</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; background: var(--white); padding: 1.2rem 1.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--card-shadow);">
                <div>
                    <h2 style="font-size: 1.4rem; color: var(--text-dark);">Video Publisher</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem; font-family: var(--font-code);">Instant Homepage Video Sync (No Title / Description Required)</p>
                </div>
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <a href="index.html" class="btn-back-home">Home</a>
                    <button onclick="logout()" class="btn" style="background:#dc2626; padding: 6px 12px; font-size: 0.85rem;">Logout 🚪</button>
                </div>
            </div>

            <!-- Single Video Upload Card -->
            <section class="card" style="max-width: 600px; margin: 0 auto 2.5rem auto;">
                <h3>Upload Homepage Showcase Video</h3>
                <form id="videoOnlyForm" style="margin-top: 1.2rem;">
                    
                    <div class="form-group">
                        <label for="videoFileInput">Select Video File (.mp4, .webm with Audio)</label>
                        <input type="file" id="videoFileInput" accept="video/mp4,video/webm" style="cursor: pointer;">
                        
                        <div style="margin-top: 12px;">
                            <label for="videoUrlInput" style="font-size: 0.82rem; color: var(--text-muted);">OR Paste Direct Video Link:</label>
                            <input type="url" id="videoUrlInput" placeholder="https://example.com/video.mp4">
                        </div>

                        <div id="videoPreviewContainer" style="display:none; margin-top: 12px; background:#000; border-radius:8px; overflow:hidden;">
                            <video id="videoPreview" autoplay loop muted playsinline style="width: 100%; max-height: 260px; display:block;"></video>
                        </div>
                    </div>

                    <button type="submit" id="publishBtn" class="btn" style="width: 100%; margin-top: 10px;">Publish Video Directly 🚀</button>
                </form>
            </section>

            <!-- Active Video Status -->
            <section style="max-width: 600px; margin: 0 auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Current Live Video</h3>
                    <button onclick="loadCurrentVideo()" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.85rem;">🔄 Refresh</button>
                </div>
                <div id="currentVideoBox"></div>
            </section>

        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("pagesDropdown").classList.toggle("active");
        }
        window.addEventListener("click", () => {
            document.getElementById("pagesDropdown").classList.remove("active");
        });

        const HASH_AUTH_SIG = "6a0f7c220023a1a5b46d0352efc15053dd5c4ec4d9da8ef7f168fecaa1efd9a9";
        if (localStorage.getItem("harsh_admin_token") !== HASH_AUTH_SIG) {
            window.location.href = "login.html";
        }

        function logout() {
            if (confirm("Logout karna chahte hain?")) {
                localStorage.removeItem("harsh_admin_token");
                window.location.href = "login.html";
            }
        }

        const SUPABASE_URL = "https://rbbryqshvycrstzrtytp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYnJ5cXNodnljcnN0enJ0eXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTI1MjYsImV4cCI6MjEwNDI4ODUyNn0.WzH2ju9G2nW8iOKnh77OFF0N3G0ECHx1iLBjcPISItc";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let videoPayload = "";

        document.getElementById("videoFileInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 16 * 1024 * 1024) {
                alert("File 16MB se badi hai! Direct URL use karein.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                videoPayload = evt.target.result;
                const v = document.getElementById("videoPreview");
                v.src = videoPayload;
                document.getElementById("videoPreviewContainer").style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("videoOnlyForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("publishBtn");
            const directUrl = document.getElementById("videoUrlInput").value.trim();
            const finalSource = directUrl || videoPayload;

            if (!finalSource) {
                alert("Pehle koi video file select karein ya URL dalein!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Syncing video to home...";

            const newPost = {
                id: Date.now(),
                title: "Homepage Feature Video",
                tag: "Video Showcase",
                img: null,
                video: finalSource,
                content: "",
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            try {
                const { error } = await supabaseClient.from('posts').insert([newPost]);
                if (error) throw error;
                alert("✅ Video homepage par live sync ho gayi!");
                this.reset();
                videoPayload = "";
                document.getElementById("videoPreviewContainer").style.display = "none";
                loadCurrentVideo();
            } catch (err) {
                alert("Upload error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish Video Directly 🚀";
            }
        });

        async function loadCurrentVideo() {
            const box = document.getElementById("currentVideoBox");
            box.innerHTML = "<p style='color:var(--text-muted);'>Checking live video...</p>";

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .not('video', 'is', null)
                    .order('id', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0 && data[0].video) {
                    box.innerHTML = `
                        <div style="background:#000; border-radius:8px; overflow:hidden;">
                            <video src="${data[0].video}" autoplay loop muted playsinline style="width:100%; max-height:260px; display:block;"></video>
                        </div>
                        <button onclick="deleteVideo(${data[0].id})" class="btn" style="background:#ef4444; width:100%; margin-top:8px; font-size:0.85rem;">Remove Current Video</button>
                    `;
                } else {
                    box.innerHTML = "<p style='color:var(--text-muted);'>Abhi koi live video uploaded nahi hai.</p>";
                }
            } catch(e) {
                box.innerHTML = "<p style='color:red;'>Fetch failed: " + e.message + "</p>";
            }
        }

        async function deleteVideo(id) {
            if (!confirm("Video homepage se remove karni hai?")) return;
            await supabaseClient.from('posts').delete().eq('id', id);
            loadCurrentVideo();
        }

        loadCurrentVideo();
    </script>
</body>
</html>
