<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HarshCode Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="images/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
                    <span class="brand-name">HarshCode<span>.Studio</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="feed.html">Posts</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admin.html" class="active">👤 Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            
            <!-- Dashboard Top Controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; background: var(--white); padding: 1.2rem 1.5rem; border-radius: 10px; border: 1px solid var(--border);">
                <div>
                    <h2 style="font-size: 1.4rem; color: var(--primary);">Admin Dashboard</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Live GitHub Sync Active</p>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <a href="index.html" class="btn-back-home">← Back to Home</a>
                    <a href="feed.html" class="btn btn-outline" target="_blank">View Live Feed</a>
                    <button onclick="logout()" class="btn" style="background:#dc2626; padding: 8px 14px;">Logout 🚪</button>
                </div>
            </div>

            <!-- Create Post Card -->
            <div class="card" style="max-width: 700px; margin: 0 auto 2.5rem auto;">
                <h3>Create New Public Post</h3>
                <form id="postForm" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Post Title</label>
                        <input type="text" id="postTitle" placeholder="e.g. New Project Completed!" required>
                    </div>
                    <div class="form-group">
                        <label>Category / Tag</label>
                        <select id="postTag">
                            <option>Web Project</option>
                            <option>Announcement</option>
                            <option>Coding Tip</option>
                            <option>Personal Update</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Upload Photo (Device se Photo Chunein)</label>
                        <input type="file" id="postFileInput" accept="image/*" style="background: var(--bg-light); cursor: pointer;">
                        <div id="previewContainer" style="display:none; margin-top: 10px; background:#0f172a; border-radius:8px; padding:6px; text-align:center;">
                            <img id="imagePreview" style="max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 6px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Post Description</label>
                        <textarea id="postContent" rows="4" placeholder="Apna message yahan likhein..." required></textarea>
                    </div>
                    <button type="submit" id="publishBtn" class="btn" style="width: 100%;">Publish Live Post 🚀</button>
                </form>
            </div>

            <h3 style="margin-bottom: 1rem;">Manage Published Posts</h3>
            <div id="adminPostsList"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 HarshCode Studio. All Rights Reserved.</p>
                <p><a href="index.html">Home</a> • <a href="feed.html">Live Feed</a></p>
            </div>
        </div>
    </footer>

    <script>
        // --- Updated GitHub Configuration ---
const GITHUB_USERNAME = "yubanshh01"; 
const GITHUB_REPO = "harshhcodestudio";           
const GITHUB_TOKEN = "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"; // Naya Classic Token Daalein
const GITHUB_BRANCH = "main";

// Session Guard
if (localStorage.getItem("harsh_admin_logged") !== "true") {
    alert("Unauthorized! Please login first.");
    window.location.href = "login.html";
}

function logout() {
    if (confirm("Logout karna chahte hain?")) {
        localStorage.removeItem("harsh_admin_logged");
        window.location.href = "login.html";
    }
}

let fileBase64Clean = "";
let originalFileName = "";

// Image Reader
document.getElementById("postFileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (file) {
        originalFileName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "");
        const reader = new FileReader();
        reader.onload = function(event) {
            const fullBase64 = event.target.result;
            document.getElementById("imagePreview").src = fullBase64;
            document.getElementById("previewContainer").style.display = "block";
            fileBase64Clean = fullBase64.split(",")[1];
        };
        reader.readAsDataURL(file);
    } else {
        fileBase64Clean = "";
        document.getElementById("previewContainer").style.display = "none";
    }
});

// Submit Form
document.getElementById("postForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const publishBtn = document.getElementById("publishBtn");
    publishBtn.disabled = true;
    publishBtn.innerText = "Step 1: Uploading Image...";

    let finalImageUrl = "";

    try {
        // Step 1: Image Upload (agar photo select ki hai)
        if (fileBase64Clean) {
            const imgUploadUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/images/posts/${originalFileName}`;
            
            const imgRes = await fetch(imgUploadUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Upload image: ${originalFileName}`,
                    content: fileBase64Clean,
                    branch: GITHUB_BRANCH
                })
            });

            if (!imgRes.ok) {
                const errData = await imgRes.json();
                throw new Error(`[Image Upload Failed - Code ${imgRes.status}]: ${errData.message}`);
            }

            finalImageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/images/posts/${originalFileName}`;
        }

        publishBtn.innerText = "Step 2: Syncing posts.json...";

        // Step 2: Get posts.json
        const jsonFileUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts.json`;
        const getRes = await fetch(jsonFileUrl, {
            headers: { 
                "Authorization": `token ${GITHUB_TOKEN}`,
                "Accept": "application/vnd.github.v3+json"
            }
        });

        let sha = "";
        let posts = [];

        if (getRes.ok) {
            const fileData = await getRes.json();
            sha = fileData.sha;
            const rawContent = decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, ""))));
            posts = JSON.parse(rawContent || "[]");
        } else if (getRes.status === 404) {
            posts = [];
        } else {
            const errData = await getRes.json();
            throw new Error(`[posts.json Read Failed - Code ${getRes.status}]: ${errData.message}`);
        }

        // Step 3: Add new post
        const newPost = {
            id: Date.now(),
            title: document.getElementById("postTitle").value.trim(),
            tag: document.getElementById("postTag").value,
            img: finalImageUrl,
            content: document.getElementById("postContent").value.trim(),
            date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
        };

        posts.unshift(newPost);

        // Step 4: Save posts.json
        const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
        const putPayload = {
            message: `Publish post: ${newPost.title}`,
            content: updatedContentBase64,
            branch: GITHUB_BRANCH
        };
        if (sha) putPayload.sha = sha;

        const putRes = await fetch(jsonFileUrl, {
            method: "PUT",
            headers: {
                "Authorization": `token ${GITHUB_TOKEN}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify(putPayload)
        });

        if (!putRes.ok) {
            const errData = await putRes.json();
            throw new Error(`[posts.json Save Failed - Code ${putRes.status}]: ${errData.message}`);
        }

        alert("Post successfully published to GitHub! 🚀");
        this.reset();
        fileBase64Clean = "";
        document.getElementById("previewContainer").style.display = "none";
        loadAdminPosts();

    } catch (err) {
        alert(err.message);
    } finally {
        publishBtn.disabled = false;
        publishBtn.innerText = "Publish Live Post 🚀";
    }
});

// Load Posts
async function loadAdminPosts() {
    const container = document.getElementById("adminPostsList");
    container.innerHTML = "<p>Loading posts from GitHub...</p>";

    try {
        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/posts.json?cb=${Date.now()}`);
        if (!res.ok) {
            container.innerHTML = "<p style='color:var(--text-muted);'>No posts file found yet.</p>";
            return;
        }

        const posts = await res.json();
        container.innerHTML = "";

        if (!posts || posts.length === 0) {
            container.innerHTML = "<p style='color:var(--text-muted);'>No posts found.</p>";
            return;
        }

        posts.forEach(post => {
            container.innerHTML += `
                <div class="post-card">
                    <div class="post-header">
                        <div>
                            <span class="post-tag">${post.tag}</span>
                            <h3 style="margin-top:4px;">${post.title}</h3>
                        </div>
                    </div>
                    <div class="post-date">📅 ${post.date}</div>
                    ${post.img ? `<div class="post-img-wrapper"><img src="${post.img}" class="post-img" alt="Post Photo"></div>` : ''}
                    <p style="margin-top:10px; color:#334155;">${post.content}</p>
                </div>
            `;
        });
    } catch (e) {
        container.innerHTML = "<p style='color:var(--text-muted);'>No posts found on repository.</p>";
    }
}

loadAdminPosts();

    </script>
                    
</body>
</html>
